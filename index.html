// ---------- Календар ----------
const MONTHS = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
let calMonth = new Date(); calMonth.setDate(1);   // який місяць показано
let selDay = ymd(new Date());                       // вибраний день (за замовчуванням — сьогодні)

// Що треба зробити в конкретний день (лише увімкнені, відсортовано за часом)
const dayTasks = d => reminders.filter(r => r.active && matches(r, d)).sort((a, b) => a.time.localeCompare(b.time));

// Велика задача «у роботі» в день key: від початку до дня перед терміном, поки не натиснуто «Виконав»
const taskDone = r => !!r.doneUntil && r.doneUntil >= `${r.date} ${r.time}`;
const workOn = key => reminders.filter(r => r.type === 'task' && r.active && r.start && r.start <= key && key < r.date && !taskDone(r));
const dmShort = k => k.slice(8, 10) + '.' + k.slice(5, 7);

let calAnim = '';   // напрямок анімації при гортанні місяця: 'l' або 'r'

// Стан однієї справи в конкретний день: виконано / прострочено / попереду / 'skip' — не показувати.
// «Виконано» беремо з журналу. Якщо позначка є, а запису в журналі немає — це дні до створення
// нагадування, їх у календарі не показуємо (інакше там стояли б галочки, яких ніхто не ставив).
let logIndex = {};
function occState(r, d) {
  const e = logIndex[`${r.id}|${occKey(r, d)}`];
  if (e) return e === 'missed' ? 'late' : e === 'late' ? 'donelate' : 'done';   // donelate — виконано, але із запізненням
  if (isDone(r, d)) {
    // Ховаємо лише дні ДО створення нагадування. Усе інше, що позначено «Виконав», — виконане,
    // навіть якщо запису в журналі немає (наприклад, позначено до появи журналу або після зміни розкладу)
    const beforeCreated = r.created ? occKey(r, d) <= r.created : d < new Date(new Date().setHours(0, 0, 0, 0));
    return beforeCreated ? 'skip' : 'done';
  }
  const [h, m] = r.time.split(':').map(Number);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m) < new Date() ? 'late' : 'next';
}

function renderCal() {
  logIndex = Object.fromEntries(log.map(e => [`${e.id}|${e.due}`, e.status]));
  const box = $('cal');
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const now = new Date(), todayStr = ymd(now);
  const isCurMonth = y === now.getFullYear() && m === now.getMonth();

  // Сітка завжди з понеділка; дні сусідніх місяців показуються блідо
  const first = new Date(y, m, 1);
  const start = new Date(y, m, 1 - ((first.getDay() || 7) - 1));
  const weeks = Math.ceil(((first.getDay() || 7) - 1 + new Date(y, m + 1, 0).getDate()) / 7);

  // Підсумок місяця для шапки
  let mTotal = 0, mLate = 0;
  for (let d = 1; d <= new Date(y, m + 1, 0).getDate(); d++) {
    const day = new Date(y, m, d);
    dayTasks(day).forEach(r => { const st = occState(r, day); if (st === 'skip') return; mTotal++; if (st === 'late') mLate++; });
  }

  let cells = DAYS.map((n, i) => `<div class="cal-wd${i > 4 ? ' we' : ''}">${n}</div>`).join('');
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const key = ymd(d);
    const ts = dayTasks(d).filter(r => occState(r, d) !== 'skip');
    const st = ts.map(r => occState(r, d));
    const late = st.includes('late');
    const cls = ['cal-day', d.getMonth() !== m ? 'other' : '', key < todayStr ? 'past' : '', key === todayStr ? 'today' : '',
      key === selDay ? 'sel' : '', i % 7 > 4 ? 'we' : '',
      new Set(ts.map(r => r.pid || r.id)).size >= 3 ? 'busy' : ''].join(' ');   // завантажений — від 3 різних завдань (кілька часів одного завдання — це одне)
    // Позначка на кожну справу, час якої минув: зелена ✓ — вчасно, жовта ✓ — із запізненням, червоний ✕ — не виконано
    const MARK = { done: '<i class="ck ok" title="Виконано вчасно">✓</i>', donelate: '<i class="ck lt" title="Виконано із запізненням">✓</i>',
      late: '<i class="ck nd" title="Не виконано">✕</i>' };
    const checks = st.map(x => MARK[x] || '').join('');
    const flag = checks ? `<span class="cd-flags">${checks}</span>` : '';
    // Смужка навантаження внизу: по сегменту на справу (до 4)
    const segs = ts.slice(0, 3).map((r, j) => MARK[st[j]] || `<i class="seg-${st[j]}"></i>`).join('') + (ts.length > 3 ? `<em>+${ts.length - 3}</em>` : '');   // у вузьку клітинку телефона влазить 3
    // На комп'ютері — до двох справ прямо в клітинці
    // На комп'ютері в клітинці — лише час здачі (назва — при наведенні); до 4 часів, далі «+N»
    const work = workOn(key);
    const chips = ts.slice(0, 4).map((r, j) => `<span class="chip s-${st[j] === 'donelate' ? 'done' : st[j]}" title="${r.time} ${esc(r.title)}"><b>${r.time}</b></span>`).join('')

    cells += `<button class="${cls}" data-k="${key}" aria-label="${longDate(d)}${ts.length ? `, справ: ${ts.length}` : ''}">
      <span class="cd-num">${d.getDate()}${ts.length > 4 ? `<span class="cd-more m4">+${ts.length - 4}</span>` : ''}${ts.length > 2 ? `<span class="cd-more m2">+${ts.length - 2}</span>` : ''}</span>${flag}
      <span class="cd-chips">${chips}</span>
      ${work.length ? `<span class="cd-work" title="${work.map(r => `У роботі: ${esc(r.title)} — до ${dmShort(r.date)}`).join('\n')}">${work.length > 1 ? work.length + ' в роботі' : '→ ' + dmShort(work[0].date)}</span>` : ''}
      <span class="cd-load">${segs}</span></button>`;
  }

  // Панель вибраного дня
  const [sy, sm, sd] = selDay.split('-').map(Number);
  const sel = new Date(sy, sm - 1, sd);
  const tasks = dayTasks(sel).filter(r => occState(r, sel) !== 'skip');
  const tag = { done: '<span class="cp-tag done">✓ вчасно</span>', donelate: '<span class="cp-tag donelate">✓ із запізненням</span>', late: '<span class="cp-tag late">✕ не виконано</span>', next: '' };
  const rows = tasks.map(r => {
    const s = occState(r, sel);   // для стилю рядка «donelate» поводиться як «done»
    const done = s === 'done' || s === 'donelate';
    // «Виконав» — лише для того разу, що зараз на черзі (прострочений або найближчий), щоб не перескакувати через інші
    const cur = !done && r.active ? current(r) : null;
    const canDo = !!cur && occKey(r, cur.d) === occKey(r, sel);
    return `<div class="cp-row s-${s}${s === 'donelate' ? ' s-done' : ''}" data-id="${r.id}" role="button" tabindex="0">
      <span class="cp-time">${r.time}</span>
      <span class="cp-body"><span class="cp-title">${esc(r.title)}</span>
        ${r.dest ? `<span class="cp-sub">Куди: ${esc(r.dest)}</span>` : ''}
        ${s === 'next' && r.lead ? `<span class="cp-sub">нагадає за ${leadText(r.lead)}</span>` : ''}
        ${done ? (() => {   // коли саме натиснули «Виконав» — щоб було видно, звідки позначка
          const e = log.find(x => x.id === r.id && x.due === occKey(r, sel) && x.doneAt);
          return `<span class="cp-sub">${e ? 'позначено ' + new Date(e.doneAt).toLocaleString('uk-UA', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : 'позначено без запису в журналі'}</span>`;
        })() : ''}</span>
      <span class="cp-right">${tag[s]}${done ? `<button class="cp-undo" data-undo="${r.id}" title="Зняти позначку «Виконав»">скасувати</button>` : ''}${canDo ? `<button class="cp-done${r.type === 'task' ? ' task' : ''}" data-done="${r.id}">Виконав</button>` : ''}</span></div>`;
  }).join('');
  const workRows = workOn(selDay).map(r => {
    const left = Math.round((new Date(r.date + 'T00:00') - new Date(selDay + 'T00:00')) / 864e5);
    return `<div class="cp-row s-work" data-id="${r.id}" role="button" tabindex="0">
      <span class="cp-time">→</span>
      <span class="cp-body"><span class="cp-title">${esc(r.title)}</span>
        <span class="cp-sub">у роботі, термін ${dmShort(r.date)} о ${r.time} — ${left === 1 ? 'завтра' : `через ${left} дн.`}</span></span>
      <span class="cp-right"><span class="cp-tag work">у роботі</span><button class="cp-done task" data-done="${r.id}" title="Зробив раніше терміну">Виконав</button></span></div>`;
  }).join('');
  const diff = Math.round((new Date(sel).setHours(0, 0, 0, 0) - new Date(now).setHours(0, 0, 0, 0)) / 864e5);
  const rel = diff === 0 ? 'Сьогодні' : diff === 1 ? 'Завтра' : diff === -1 ? 'Вчора' : '';

  box.innerHTML = `<div class="cal-card">
    <div class="cal-head">
      <div class="cal-title"><span class="cal-m">${MONTHS[m]}</span><span class="cal-y">${y}</span>
        <div class="cal-sum">${mTotal ? `справ у місяці: ${mTotal}` : 'у цьому місяці справ немає'}${mLate ? `, <span class="c-miss">прострочено: ${mLate}</span>` : ''}</div></div>
      <div class="cal-navs">
        ${isCurMonth && selDay === todayStr ? '' : '<button class="cal-today" id="calToday">Сьогодні</button>'}
        <button class="cal-nav" id="calPrev" aria-label="Попередній місяць">‹</button>
        <button class="cal-nav" id="calNext" aria-label="Наступний місяць">›</button>
      </div>
    </div>
    <div class="cal-grid ${calAnim ? 'slide-' + calAnim : ''}" id="calGrid">${cells}</div>
  </div>
  <div class="cal-panel">
    <div class="cp-head"><span class="cp-day">${sel.getDate()}</span>
      <span class="cp-date"><b>${rel || WD_FULL[sel.getDay()]}</b><span>${rel ? WD_FULL[sel.getDay()] + ', ' : ''}${sel.getDate()} ${MONTHS_GEN[sel.getMonth()]}</span></span>
      <span class="cp-count">${tasks.length ? `справ: ${tasks.length}` : ''}</span></div>
    ${rows + workRows || '<div class="cp-empty">Вільний день. Натисніть «+», щоб додати справу.</div>'}
  </div>`;
  calAnim = '';

  box.querySelectorAll('.cal-day').forEach(b => b.onclick = () => {
    const k = b.dataset.k, [ky, km] = k.split('-').map(Number);
    selDay = k;
    if (ky !== y || km - 1 !== m) { calAnim = (ky * 12 + km - 1) > (y * 12 + m) ? 'l' : 'r'; calMonth = new Date(ky, km - 1, 1); }
    renderCal();
  });
  box.querySelectorAll('.cp-row').forEach(b => {
    b.onclick = () => openForm(reminders.find(r => r.id === b.dataset.id));
    b.onkeydown = e => { if (e.key === 'Enter') b.onclick(); };
  });
  box.querySelectorAll('.cp-done').forEach(b => b.onclick = e => {
    e.stopPropagation();   // щоб не відкривалась форма
    markDone(reminders.find(r => r.id === b.dataset.done));
  });
  box.querySelectorAll('.cp-undo').forEach(b => b.onclick = e => {
    e.stopPropagation();   // щоб не відкривалась форма редагування
    undoDone(reminders.find(r => r.id === b.dataset.undo), sel);
  });
  $('calPrev').onclick = () => { calAnim = 'r'; calMonth = new Date(y, m - 1, 1); renderCal(); };
  $('calNext').onclick = () => { calAnim = 'l'; calMonth = new Date(y, m + 1, 1); renderCal(); };
  if ($('calToday')) $('calToday').onclick = () => {
    const back = (now.getFullYear() * 12 + now.getMonth()) < (y * 12 + m);
    if (!isCurMonth) calAnim = back ? 'r' : 'l';
    calMonth = new Date(now.getFullYear(), now.getMonth(), 1); selDay = todayStr; renderCal();
  };
}

function render() {
  renderCal();
  $('today').textContent = longDate(new Date());
  const list = $('list');
  list.innerHTML = '';
  if (!reminders.length) {
    list.innerHTML = '<div class="empty">Нагадувань поки немає.<br>Натисніть «+», щоб додати перше.<br><br><button class="ghost demo-btn" id="btnDemo">Заповнити прикладом</button></div>';
    $('btnDemo').onclick = fillDemo;
    return;
  }
  // Спочатку увімкнені — за найближчим часом, потім вимкнені
  const sorted = reminders.map(r => ({ r, c: r.active ? current(r) : null }))
    .map(x => ({ ...x, n: x.c ? x.c.d : null }))
    .sort((a, b) => (b.r.active - a.r.active) || ((a.n || Infinity) - (b.n || Infinity)));
  for (const { r, c, n } of sorted) {
    const wrap = document.createElement('div');
    wrap.className = 'swipe';
    wrap.innerHTML = `<button class="swipe-del">Видалити</button>`;
    const el = document.createElement('div');
    el.className = 'item' + (r.active ? '' : ' off');
    el.innerHTML = `<button class="rm-left" aria-label="Видалити" title="Видалити">✕</button><div class="time"></div><div><div class="title"></div><div class="why"></div><div class="dest"></div><div class="rule"></div><span class="next"></span></div><div class="acts"><button class="ghost ed">Змінити</button></div>`;
    el.querySelector('.time').textContent = r.time;
    el.querySelector('.title').textContent = r.title;
    const why = el.querySelector('.why');
    if (r.note) why.textContent = r.note; else why.remove();
    const dest = el.querySelector('.dest');
    if (r.dest) dest.textContent = 'Куди: ' + r.dest; else dest.remove();
    el.querySelector('.rule').textContent = describeRule(r) + (r.lead ? `, нагадає за ${leadText(r.lead)}` : '');
    const next = el.querySelector('.next');
    if (!r.active) next.textContent = 'Вимкнено';
    else if (!c) next.textContent = r.doneUntil ? 'Виконано' : 'Більше не спрацює';
    else if (c.late) { next.textContent = 'Не виконано: ' + describeNext(c.d).toLowerCase(); next.classList.add('late'); }
    else next.textContent = describeNext(c.d);
    el.querySelector('.ed').onclick = () => openForm(r);
    const del = () => askDelete(r, wrap);
    el.querySelector('.rm-left').onclick = del;
    wrap.querySelector('.swipe-del').onclick = del;
    addSwipe(wrap, el);
    wrap.appendChild(el);
    list.appendChild(wrap);
  }
}

// ---------- Видалення: підтвердження ----------
function askDelete(r, wrap) {
  const dlg = $('dlgConfirm');
  $('confirmText').textContent = `«${r.title}»` + (r.pid ? ` — усі ${r.nTimes} рази на день` : '');
  dlg.returnValue = '';
  dlg.onclose = () => {
    if (dlg.returnValue === 'yes') {
      reminders = reminders.filter(x => x.id !== r.id && !(r.pid && x.pid === r.pid));
      saveRemote();
    } else closeSwipe(wrap);
  };
  dlg.showModal();
}

// ---------- Свайп уліво на телефоні ----------
const OPEN = -108; // на скільки зсувається рядок — ширина червоної кнопки

function closeSwipe(wrap) {
  if (!wrap) return;
  wrap.classList.remove('open');
  wrap.querySelector('.item').style.transform = '';
}

function addSwipe(wrap, el) {
  let x0 = 0, y0 = 0, base = 0, dx = 0, mode = null; // mode: 'h' — свайп, 'v' — прокрутка
  el.addEventListener('touchstart', e => {
    const t = e.touches[0];
    x0 = t.clientX; y0 = t.clientY; dx = 0; mode = null;
    base = wrap.classList.contains('open') ? OPEN : 0;
    // Відкритий інший рядок — закриваємо
    document.querySelectorAll('.swipe.open').forEach(w => { if (w !== wrap) closeSwipe(w); });
  }, { passive: true });
  el.addEventListener('touchmove', e => {
    const t = e.touches[0];
    const mx = t.clientX - x0, my = t.clientY - y0;
    if (!mode && (Math.abs(mx) > 8 || Math.abs(my) > 8)) mode = Math.abs(mx) > Math.abs(my) ? 'h' : 'v';
    if (mode !== 'h') return;
    e.preventDefault(); // не даємо сторінці прокручуватись під час свайпу
    dx = mx;
    el.classList.add('dragging');
    el.style.transform = `translateX(${Math.min(0, Math.max(OPEN - 24, base + dx))}px)`;
  }, { passive: false });
  el.addEventListener('touchend', () => {
    el.classList.remove('dragging');
    if (mode !== 'h') return;
    const pos = base + dx;
    if (pos < OPEN / 2) { wrap.classList.add('open'); el.style.transform = `translateX(${OPEN}px)`; }
    else closeSwipe(wrap);
  });
  // Дотик по відкритому рядку — просто закрити, нічого не відкривати
  el.addEventListener('click', e => {
    if (wrap.classList.contains('open')) { e.stopPropagation(); e.preventDefault(); closeSwipe(wrap); }
  }, true);
}

// ---------- Форма нагадування ----------
// «Останній день місяця» вимикає поле числа
function updateLast() {
  const on = $('fLast').checked;
  $('fDay').disabled = on;
  $('fDay').closest('label').style.opacity = on ? .4 : 1;
}
$('fLast').addEventListener('change', updateLast);

function setType(t) {
  formType = t;
  // «Задача» має власну форму: без вибору розкладу, з терміном і (за бажанням) початком
  $('fType').parentElement.style.display = t === 'task' ? 'none' : '';
  $('boxTask').style.display = t === 'task' ? '' : 'none';
  const task = t === 'task';
  $('dlgItem').classList.toggle('task', task);
  $('dateLbl').textContent = task ? ($('fBig').checked ? 'Здати — кінцева дата' : 'Здати — дата') : 'Дата';
  // Нова задача: лише що зробити, коли здати і кому. Решту полів ховаю
  ['boxNote', 'boxActive'].forEach(id => $(id).style.display = task ? 'none' : '');
  $('destLbl').textContent = task ? 'Кому здати' : 'Кому здати або куди завантажити';
  $('destOpt').style.display = task ? 'none' : '';
  // Порядок у задачі: … до якої години → кому здати → за скільки нагадати
  const timesBox = $('timesList').closest('.times-box');
  if (task) { timesBox.after($('boxDest')); $('boxDest').after($('boxLeadSel'), $('boxLead'), $('leadHint')); }
  else { $('boxNote').after($('boxDest')); timesBox.after($('boxLeadSel'), $('boxLead'), $('leadHint')); }
  $('boxLeadSel').firstChild.textContent = task ? 'Нагадати до здачі за ' : 'Нагадати заздалегідь';
  updateLead();
  // У задачі один термін — кількох часів не буває
  $('timeLbl').textContent = task ? 'До якої години' : 'Час виконання';
  $('btnAddTime').style.display = $('timesHint').style.display = t === 'task' ? 'none' : '';
  if (t === 'task' && readTimesRaw().length > 1) drawTimes([readTimes()[0]]);
  document.querySelectorAll('#fType button').forEach(b => b.setAttribute('aria-pressed', b.dataset.type === t));
  $('boxWeekly').style.display = t === 'weekly' ? '' : 'none';
  $('boxMonthly').style.display = t === 'monthly' ? '' : 'none';
  $('boxOnce').style.display = t === 'once' || t === 'task' ? '' : 'none';
}

function drawDays() {
  $('boxWeekly').innerHTML = '';
  DAYS.forEach((name, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = name;
    b.setAttribute('aria-pressed', formDays.includes(i + 1));
    b.onclick = () => {
      formDays = formDays.includes(i + 1) ? formDays.filter(x => x !== i + 1) : [...formDays, i + 1];
      drawDays();
    };
    $('boxWeekly').appendChild(b);
  });
}

// Поля часу: перше має id fTime (на нього спирається підказка «заздалегідь»)
function drawTimes(times) {
  $('timesList').innerHTML = '';
  times.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'time-row' + (times.length > 1 ? '' : ' single');   // один час — поле на всю ширину
    row.innerHTML = `<input type="time" class="f-time" required value="${t}"${i === 0 ? ' id="fTime"' : ''}>`
      + (times.length > 1 ? '<button type="button" aria-label="Прибрати цей час">✕</button>' : '');
    row.querySelector('input').addEventListener('input', updateLead);
    const del = row.querySelector('button');
    if (del) del.onclick = () => drawTimes(readTimesRaw().filter((_, j) => j !== i));
    $('timesList').appendChild(row);
  });
}
const readTimesRaw = () => [...document.querySelectorAll('.f-time')].map(i => i.value);
const readTimes = () => [...new Set(readTimesRaw().filter(Boolean))].sort();
$('btnAddTime').onclick = () => {
  const ts = readTimesRaw();
  const last = ts[ts.length - 1] || '09:00';
  const h = Math.min(23, +last.slice(0, 2) + 3);   // новий час — на 3 години пізніше за останній
  drawTimes([...ts, `${String(h).padStart(2, '0')}:${last.slice(3, 5)}`]);
  updateLead();
};

function updateBig() {
  const big = $('fBig').checked;
  $('boxStart').style.display = big ? '' : 'none';
  document.querySelectorAll('#fSpan button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.big === (big ? '1' : '0'))));
  if (formType === 'task') $('dateLbl').textContent = big ? 'Здати — кінцева дата' : 'Здати — дата';
}
document.querySelectorAll('#fSpan button').forEach(b => b.onclick = () => { $('fBig').checked = b.dataset.big === '1'; updateBig(); });

function openForm(r, mode) {
  // Нагадування з кількома часами редагуємо цілком (усі часи разом)
  const group = r && r.pid ? reminders.filter(x => x.pid === r.pid) : null;
  editingId = r ? (r.pid || r.id) : null;
  const isTask = mode === 'task' || (r && r.type === 'task');
  $('formTitle').textContent = isTask ? (r ? 'Змінити задачу' : 'Нова задача') : (r ? 'Змінити нагадування' : 'Нове нагадування');
  $('fTitle').value = r ? r.title : '';
  $('fNote').value = r && r.note ? r.note : '';
  $('fDest').value = r && r.dest ? r.dest : '';
  drawTimes(group ? group.map(x => x.time).sort() : [r ? r.time : '09:00']);
  const lead = r ? (r.lead || 0) : (mode === 'task' ? 60 : 0);   // новій задачі одразу пропоную «за 1 годину»
  const preset = [...$('fLead').options].some(o => o.value === String(lead));
  $('fLead').value = preset ? String(lead) : 'custom';
  if (!preset) {  // свій варіант — розкладаємо на число й одиниці
    const unit = lead % 1440 === 0 ? 1440 : lead % 60 === 0 ? 60 : 1;
    $('fLeadUnit').value = String(unit); $('fLeadNum').value = lead / unit;
  }
  updateLead();
  $('fDay').value = r && r.day ? r.day : new Date().getDate();
  $('fLast').checked = !!(r && r.last);
  updateLast();
  $('fDate').value = r && r.date ? r.date : ymd(new Date());
  $('fBig').checked = !!(r && r.start);
  $('fStart').value = r && r.start ? r.start : ymd(new Date());
  updateBig();
  $('fActive').checked = r ? r.active : true;
  formDays = r && r.days ? [...r.days] : [new Date().getDay() || 7];
  $('btnDelete').style.visibility = r ? 'visible' : 'hidden';
  setType(r ? r.type : (mode === 'task' ? 'task' : 'daily'));
  drawDays();
  $('dlgItem').showModal();
}

$('formItem').onsubmit = e => {
  e.preventDefault();
  if (formType === 'weekly' && !formDays.length) { alert('Виберіть хоча б один день тижня.'); return; }
  const times = readTimes();
  if (!times.length) { alert('Вкажіть час виконання.'); return; }
  const gid = editingId || Date.now().toString(36);
  const base = {
    title: $('fTitle').value.trim(),
    note: $('fNote').value.trim() || undefined, // порожнє поле не зберігаємо
    dest: $('fDest').value.trim() || undefined,
    type: formType,
    lead: readLead() || undefined, // 0 — не зберігаємо
    active: $('fActive').checked
  };
  if (formType === 'weekly') base.days = [...formDays].sort();
  if (formType === 'monthly') {
    if ($('fLast').checked) base.last = true;
    else base.day = Math.min(31, Math.max(1, +$('fDay').value || 1));
  }
  if (formType === 'once' || formType === 'task') base.date = $('fDate').value;
  if (formType === 'task' && $('fBig').checked) {
    if ($('fStart').value > $('fDate').value) { alert('Початок не може бути пізніше за термін.'); return; }
    if ($('fStart').value < $('fDate').value) base.start = $('fStart').value;   // однаковий день — це звичайна разова задача
  }

  // Старі записи цього нагадування (один або кілька часів)
  const old = editingId ? reminders.filter(r => r.id === editingId || r.pid === editingId) : [];
  const now = new Date();
  const nowKey = `${ymd(now)} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  const created = old[0]?.created || nowKey;   // момент створення — дні до нього в календарі не показуємо
  const made = times.map(t => {
    const prev = old.find(o => o.time === t) || (old.length === 1 && times.length === 1 ? old[0] : null);
    const item = { ...base, time: t, created,
      // Позначки «Виконав» зберігаємо для того самого часу; новий час — рахуємо від цієї хвилини
      doneUntil: prev?.doneUntil || nowKey };
    if (times.length > 1) Object.assign(item, { id: `${gid}@${t}`, pid: gid, nTimes: times.length });
    else item.id = gid;
    return item;
  });
  const pos = editingId ? reminders.findIndex(r => r.id === editingId || r.pid === editingId) : -1;
  const rest = reminders.filter(r => !old.includes(r));
  reminders = pos < 0 ? [...rest, ...made] : [...rest.slice(0, pos), ...made, ...rest.slice(pos)];
  $('dlgItem').close();
  saveRemote();
};

// ---------- Нагадати заздалегідь ----------
function readLead() {
  if ($('fLead').value !== 'custom') return +$('fLead').value;
  return Math.max(1, Math.min(99, +$('fLeadNum').value || 1)) * +$('fLeadUnit').value;
}
function updateLead() {
  $('boxLead').style.display = $('fLead').value === 'custom' ? '' : 'none';
  const l = readLead(), hint = $('leadHint');
  hint.style.display = l ? '' : 'none';
  const ts = readTimes();
  hint.textContent = l ? (ts.length > 1 ? `На кожен час — два нагадування: за ${leadText(l)} до нього і в сам час.`
    : formType === 'task' ? `Нагадаю за ${leadText(l)} до здачі і ще раз о ${ts[0] || ''}.`
    : `Буде два нагадування: за ${leadText(l)} до терміну і о ${ts[0] || ''}.`) : '';
}
['fLead', 'fLeadNum', 'fLeadUnit'].forEach(id => $(id).addEventListener('input', updateLead));

$('btnDelete').onclick = () => {
  if (!confirm('Видалити це нагадування?')) return;
  reminders = reminders.filter(r => r.id !== editingId && r.pid !== editingId);
  $('dlgItem').close();
  saveRemote();
};
$('btnCancel').onclick = () => $('dlgItem').close();
document.querySelectorAll('#fType button').forEach(b => b.onclick = () => setType(b.dataset.type));
// «+»: меню — нова задача або регулярне нагадування
function fabMenu(open) {
  $('fabMenu').hidden = !open;
  $('btnAdd').classList.toggle('open', open);
  $('btnAdd').textContent = open ? '✕' : '+';
}
$('btnAdd').onclick = e => { e.stopPropagation(); fabMenu($('fabMenu').hidden); };
document.addEventListener('click', e => { if (!$('fabMenu').hidden && !$('fabMenu').contains(e.target)) fabMenu(false); });
$('btnNewTask').onclick = () => { fabMenu(false); openForm(null, 'task'); };
$('btnNewRem').onclick = () => { fabMenu(false); openForm(null); };

// ---------- Налаштування ----------
$('btnSettings').onclick = () => {
  $('sOwner').value = settings.owner || '';
  $('sRepo').value = settings.repo || 'work-data';
  $('sToken').value = settings.token || '';
  $('sTopic').value = settings.topic || '';
  $('dlgSettings').showModal();
};
$('btnSettingsCancel').onclick = () => $('dlgSettings').close();
$('formSettings').onsubmit = e => {
  e.preventDefault();
  settings = {
    owner: $('sOwner').value.trim(), repo: $('sRepo').value.trim(),
    token: $('sToken').value.trim(), topic: $('sTopic').value.trim()
  };
  saveSettings(settings);
  $('dlgSettings').close();
  loadRemote();
};
$('btnWipe').onclick = () => {
  if (!confirm('Стерти всі нагадування й журнал, збережені на цьому пристрої? Дані в GitHub це не зачепить.')) return;
  try { localStorage.removeItem(LOCAL_KEY); } catch {}
  $('dlgSettings').close();
  loadRemote();
};
$('btnTest').onclick = async () => {
  const topic = $('sTopic').value.trim();
  if (!topic) { alert('Спочатку вкажіть тему ntfy.'); return; }
  try {
    const res = await fetch('https://ntfy.sh/', { method: 'POST',
      body: JSON.stringify({ topic, title: 'WORK', message: 'Пробне сповіщення — усе працює', tags: ['white_check_mark'] }) });
    alert(res.ok ? 'Надіслано. Перевірте телефон.' : 'ntfy відповів помилкою ' + res.status);
  } catch { alert('Немає зв’язку з ntfy.sh'); }
};

// Оновлюємо «наступне спрацювання» щохвилини та при поверненні на вкладку
setInterval(() => { if (!document.querySelector('.swipe.open')) render(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadRemote(); });
// Годинник у шапці: оновлюється щосекунди, дата — опівночі
function tick() {
  const n = new Date();
  $('clock').textContent = n.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const d = longDate(n);
  if ($('today').textContent !== d) { $('today').textContent = d; if ($('today').dataset.set) render(); $('today').dataset.set = 1; }
}
tick(); setInterval(tick, 1000);

// Висоту шапки передаю в CSS, щоб закріплений календар ставав одразу під нею
const setHeadH = () => document.documentElement.style.setProperty('--head-h', Math.ceil(document.querySelector('header').getBoundingClientRect().height) + 'px');
setHeadH(); new ResizeObserver(setHeadH).observe(document.querySelector('header'));   // висота змінюється, коли довантажується шрифт
loadRemote();
</script>
</body>
</html>
